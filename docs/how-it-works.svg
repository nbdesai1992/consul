<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="How Consul works. You describe an app in one sentence. A sealed scroll travels a Roman road through four stations: I Describe; II Mandate, a plan of four requirements you approve; III Build, where three specialists raise three columns (the database and two services go live on Render, 11 backend tests pass against the real database, the screens are checked by screenshot); IV Live, where the temple lights, both web addresses answer, every requirement is checked, and the scroll is sealed PROBATVM.">
<style>
  .a { animation-duration: 18s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  .serif { font-family: Cinzel, "Trajan Pro", Georgia, "Times New Roman", serif; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .ink { fill: #F1ECE4; } .dim { fill: #9A90A3; } .gold { fill: #D6B25C; } .rose { fill: #D77C9B; } .green { fill: #8DBB6E; }
  .card { fill: #211C27; stroke: #352E3E; stroke-width: 1.5; }

  /* whole scene fades out before the loop restarts */
  .scene { animation-name: scene; }
  @keyframes scene { 0%, 95% { opacity: 1; } 98.5%, 100% { opacity: 0; } }

  /* the road fills as the scroll advances */
  .fill { transform-box: fill-box; transform-origin: left center; animation-name: fill; }
  @keyframes fill { 0%, 12% { transform: scaleX(0); } 20%, 35% { transform: scaleX(.3338); } 42%, 66% { transform: scaleX(.6662); } 72%, 100% { transform: scaleX(1); } }
  .scroll { animation-name: travel; transform: translate(870px, 176px); }
  @keyframes travel { 0%, 12% { transform: translate(130px, 176px); } 20%, 35% { transform: translate(377px, 176px); } 42%, 66% { transform: translate(623px, 176px); } 72%, 100% { transform: translate(870px, 176px); } }

  /* stations light up when the scroll reaches them */
  .st2 { animation-name: st2; } @keyframes st2 { 0%, 18% { opacity: .35; } 21%, 100% { opacity: 1; } }
  .st3 { animation-name: st3; } @keyframes st3 { 0%, 40% { opacity: .35; } 43%, 100% { opacity: 1; } }
  .st4 { animation-name: st4; } @keyframes st4 { 0%, 70% { opacity: .35; } 73%, 100% { opacity: 1; } }
  .n2 { fill: #D77C9B; animation-name: n2; } @keyframes n2 { 0%, 18% { fill: #17131C; } 21%, 100% { fill: #D77C9B; } }
  .n3 { fill: #D77C9B; animation-name: n3; } @keyframes n3 { 0%, 40% { fill: #17131C; } 43%, 100% { fill: #D77C9B; } }
  .n4 { fill: #8DBB6E; animation-name: n4; } @keyframes n4 { 0%, 70% { fill: #17131C; } 73%, 100% { fill: #8DBB6E; } }

  /* III: three columns rise, one per specialist */
  .shaft { transform-box: fill-box; transform-origin: 50% 100%; }
  .c1 { animation-name: c1; } @keyframes c1 { 0%, 43% { transform: scaleY(.12); } 48%, 100% { transform: scaleY(1); } }
  .c2 { animation-name: c2; } @keyframes c2 { 0%, 49% { transform: scaleY(.12); } 54%, 100% { transform: scaleY(1); } }
  .c3 { animation-name: c3; } @keyframes c3 { 0%, 55% { transform: scaleY(.12); } 60%, 100% { transform: scaleY(1); } }

  /* IV: the temple and its lamp */
  .temple { fill: #223020; stroke: #8DBB6E; animation-name: temple; }
  @keyframes temple { 0%, 73% { fill: #211C27; stroke: #4A4252; } 76%, 100% { fill: #223020; stroke: #8DBB6E; } }
  .lamp { fill: #8DBB6E; animation-name: lamp; } @keyframes lamp { 0%, 73% { fill: #4A4252; } 76%, 100% { fill: #8DBB6E; } }

  /* panel rows appear in order */
  .r1 { animation-name: r1; } @keyframes r1 { 0%, 20% { opacity: 0; } 23%, 100% { opacity: 1; } }
  .r2 { animation-name: r2; } @keyframes r2 { 0%, 23% { opacity: 0; } 26%, 100% { opacity: 1; } }
  .r3 { animation-name: r3; } @keyframes r3 { 0%, 26% { opacity: 0; } 29%, 100% { opacity: 1; } }
  .r4 { animation-name: r4; } @keyframes r4 { 0%, 29% { opacity: 0; } 32%, 100% { opacity: 1; } }
  .ok1 { animation-name: ok1; } @keyframes ok1 { 0%, 46% { opacity: 0; } 48%, 100% { opacity: 1; } }
  .ok2 { animation-name: ok2; } @keyframes ok2 { 0%, 52% { opacity: 0; } 54%, 100% { opacity: 1; } }
  .ok3 { animation-name: ok3; } @keyframes ok3 { 0%, 58% { opacity: 0; } 60%, 100% { opacity: 1; } }
  .sp { animation-name: sp; } @keyframes sp { 0%, 42% { opacity: .3; } 45%, 100% { opacity: 1; } }
  .chk { animation-name: chk; } @keyframes chk { 0%, 78% { opacity: 0; } 81%, 100% { opacity: 1; } }
  .url1, .url2 { fill: #8DBB6E; }
  .url1 { animation-name: url1; } @keyframes url1 { 0%, 75% { fill: #4A4252; } 77%, 100% { fill: #8DBB6E; } }
  .url2 { animation-name: url2; } @keyframes url2 { 0%, 76% { fill: #4A4252; } 78%, 100% { fill: #8DBB6E; } }
  .livetxt { animation-name: livetxt; } @keyframes livetxt { 0%, 74% { opacity: .35; } 77%, 100% { opacity: 1; } }
  .seal { transform-box: fill-box; transform-origin: center; animation-name: seal; }
  @keyframes seal { 0%, 82% { opacity: 0; transform: scale(2.2) rotate(-25deg); } 85% { opacity: 1; transform: scale(.9) rotate(0deg); } 87%, 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
  .stamp { animation-name: stamp; } @keyframes stamp { 0%, 85% { opacity: 0; } 88%, 100% { opacity: 1; } }
  .caret { animation-name: caret; animation-duration: 1s; animation-timing-function: steps(1); }
  @keyframes caret { 0% { opacity: 1; } 50% { opacity: 0; } }
  .typing { animation-name: typing; } @keyframes typing { 0% { opacity: 0; } 3%, 100% { opacity: 1; } }
</style>
<defs>
  <symbol id="laurel" viewBox="0 0 32 32"><g fill="#D6B25C" stroke="#D6B25C" color="#D6B25C"><ellipse cx="10.76" cy="27.76" rx="3.40" ry="1.15" transform="rotate(-206.0 10.76 27.76)"/><ellipse cx="11.63" cy="23.67" rx="3.40" ry="1.15" transform="rotate(-130.0 11.63 23.67)"/><ellipse cx="6.02" cy="23.93" rx="3.23" ry="1.09" transform="rotate(-178.0 6.02 23.93)"/><ellipse cx="8.58" cy="20.88" rx="3.23" ry="1.09" transform="rotate(-102.0 8.58 20.88)"/><ellipse cx="3.61" cy="18.40" rx="3.06" ry="1.03" transform="rotate(-150.0 3.61 18.40)"/><ellipse cx="7.11" cy="16.99" rx="3.06" ry="1.03" transform="rotate(-74.0 7.11 16.99)"/><ellipse cx="4.03" cy="12.45" rx="2.89" ry="0.98" transform="rotate(-122.0 4.03 12.45)"/><ellipse cx="7.57" cy="12.82" rx="2.89" ry="0.98" transform="rotate(-46.0 7.57 12.82)"/><ellipse cx="7.11" cy="7.42" rx="2.72" ry="0.92" transform="rotate(-94.0 7.11 7.42)"/><ellipse cx="9.88" cy="9.29" rx="2.72" ry="0.92" transform="rotate(-18.0 9.88 9.29)"/><ellipse cx="12.11" cy="4.40" rx="2.55" ry="0.86" transform="rotate(-66.0 12.11 4.40)"/><ellipse cx="13.58" cy="7.17" rx="2.55" ry="0.86" transform="rotate(10.0 13.58 7.17)"/><path d="M13.82 26.27A10.5 10.5 0 0 1 11.07 6.73" fill="none"  stroke-width="1.1"/><ellipse cx="20.37" cy="23.67" rx="3.40" ry="1.15" transform="rotate(-50.0 20.37 23.67)"/><ellipse cx="21.24" cy="27.76" rx="3.40" ry="1.15" transform="rotate(26.0 21.24 27.76)"/><ellipse cx="23.42" cy="20.88" rx="3.23" ry="1.09" transform="rotate(-78.0 23.42 20.88)"/><ellipse cx="25.98" cy="23.93" rx="3.23" ry="1.09" transform="rotate(-2.0 25.98 23.93)"/><ellipse cx="24.89" cy="16.99" rx="3.06" ry="1.03" transform="rotate(-106.0 24.89 16.99)"/><ellipse cx="28.39" cy="18.40" rx="3.06" ry="1.03" transform="rotate(-30.0 28.39 18.40)"/><ellipse cx="24.43" cy="12.82" rx="2.89" ry="0.98" transform="rotate(-134.0 24.43 12.82)"/><ellipse cx="27.97" cy="12.45" rx="2.89" ry="0.98" transform="rotate(-58.0 27.97 12.45)"/><ellipse cx="22.12" cy="9.29" rx="2.72" ry="0.92" transform="rotate(-162.0 22.12 9.29)"/><ellipse cx="24.89" cy="7.42" rx="2.72" ry="0.92" transform="rotate(-86.0 24.89 7.42)"/><ellipse cx="18.42" cy="7.17" rx="2.55" ry="0.86" transform="rotate(-190.0 18.42 7.17)"/><ellipse cx="19.89" cy="4.40" rx="2.55" ry="0.86" transform="rotate(-114.0 19.89 4.40)"/><path d="M18.18 26.27A10.5 10.5 0 0 0 20.93 6.73" fill="none"  stroke-width="1.1"/></g></symbol>
  <pattern id="key" width="18" height="9" patternUnits="userSpaceOnUse"><path d="M0 8H17V1H3V6H13V3.5H7" fill="none" stroke="#D6B25C" stroke-opacity=".55" stroke-width="1.3"/></pattern>
</defs>

<rect width="1000" height="560" rx="18" fill="#17131C"/>
<rect x="0" y="0" width="1000" height="9" fill="url(#key)"/>

<!-- header -->
<use href="#laurel" x="36" y="26" width="38" height="38"/>
<text x="84" y="52" class="serif ink" font-size="26" font-weight="700" letter-spacing="5">CONSUL</text>
<text x="85" y="78" class="serif rose" font-size="15" letter-spacing=".5">Set the mandate. Consul sees it through.</text>
<rect x="582" y="30" width="382" height="34" rx="8" fill="#211C27" stroke="#352E3E"/>
<text x="598" y="52" class="mono dim" font-size="13"><tspan class="gold">/spec create</tspan><tspan fill="#F1ECE4"> "an invoice tracker for freelancers"</tspan></text>
<rect x="953" y="38" width="2" height="18" fill="#D6B25C" class="a caret"/>

<g class="a scene">
  <!-- the road: paving stones, then the filled stretch -->
  <line x1="130" y1="200" x2="870" y2="200" stroke="#3A3342" stroke-width="8" stroke-dasharray="14 4"/>
  <g class="a fill"><line x1="130" y1="200" x2="870" y2="200" stroke="#D77C9B" stroke-width="8" stroke-dasharray="14 4"/></g>

  <!-- milestones -->
  <circle cx="130" cy="200" r="9" fill="#D77C9B" stroke="#D77C9B" stroke-width="3"/>
  <circle cx="377" cy="200" r="9" class="a n2" stroke="#D77C9B" stroke-width="3"/>
  <circle cx="623" cy="200" r="9" class="a n3" stroke="#D77C9B" stroke-width="3"/>
  <circle cx="870" cy="200" r="9" class="a n4" stroke="#8DBB6E" stroke-width="3"/>

  <!-- I describe -->
  <g transform="translate(98,228)">
    <path d="M6 4h52a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H26l-10 10v-10H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z" fill="#211C27" stroke="#C4BCC9" stroke-width="2"/>
    <rect x="12" y="14" width="36" height="3" rx="1.5" fill="#9A90A3"/><rect x="12" y="22" width="24" height="3" rx="1.5" fill="#9A90A3"/>
  </g>
  <text x="130" y="302" text-anchor="middle" class="serif rose" font-size="13" font-weight="700" letter-spacing="2">I</text>
  <text x="130" y="322" text-anchor="middle" class="sans ink" font-size="15" font-weight="600">Describe</text>

  <!-- II mandate -->
  <g class="a st2">
    <g transform="translate(345,226)">
      <rect x="10" y="6" width="44" height="40" rx="1" fill="#2E2A20" stroke="#D77C9B" stroke-width="2"/>
      <rect x="5" y="1" width="54" height="8" rx="4" fill="#3A3120" stroke="#D6B25C" stroke-width="1.6"/>
      <rect x="5" y="43" width="54" height="8" rx="4" fill="#3A3120" stroke="#D6B25C" stroke-width="1.6"/>
      <rect x="17" y="16" width="28" height="2.5" rx="1" fill="#9A90A3"/><rect x="17" y="23" width="20" height="2.5" rx="1" fill="#9A90A3"/><rect x="17" y="30" width="24" height="2.5" rx="1" fill="#9A90A3"/>
      <circle cx="47" cy="38" r="4.5" fill="#D2463C"/>
    </g>
    <text x="377" y="302" text-anchor="middle" class="serif rose" font-size="13" font-weight="700" letter-spacing="2">II</text>
    <text x="377" y="322" text-anchor="middle" class="sans ink" font-size="15" font-weight="600">Mandate</text>
  </g>

  <!-- III build: three columns -->
  <g class="a st3">
    <g transform="translate(588,226)" fill="#211C27" stroke="#D77C9B" stroke-width="1.6">
      <rect x="0" y="0" width="18" height="5" rx="1"/><rect class="shaft a c1" x="3" y="5" width="12" height="40"/><rect x="0" y="45" width="18" height="6" rx="1"/>
      <rect x="26" y="0" width="18" height="5" rx="1"/><rect class="shaft a c2" x="29" y="5" width="12" height="40"/><rect x="26" y="45" width="18" height="6" rx="1"/>
      <rect x="52" y="0" width="18" height="5" rx="1"/><rect class="shaft a c3" x="55" y="5" width="12" height="40"/><rect x="52" y="45" width="18" height="6" rx="1"/>
    </g>
    <text x="623" y="302" text-anchor="middle" class="serif rose" font-size="13" font-weight="700" letter-spacing="2">III</text>
    <text x="623" y="322" text-anchor="middle" class="sans ink" font-size="15" font-weight="600">Build</text>
  </g>

  <!-- IV live: the temple -->
  <g class="a st4">
    <g transform="translate(834,226)" stroke-width="1.6">
      <path class="a temple" d="M2 14L36 1L70 14Z"/>
      <circle class="a lamp" cx="36" cy="9.5" r="3"/>
      <rect class="a temple" x="2" y="14" width="68" height="5"/>
      <rect class="a temple" x="8" y="19" width="8" height="25"/><rect class="a temple" x="23" y="19" width="8" height="25"/><rect class="a temple" x="41" y="19" width="8" height="25"/><rect class="a temple" x="56" y="19" width="8" height="25"/>
      <rect class="a temple" x="0" y="44" width="72" height="5"/>
    </g>
    <text x="870" y="302" text-anchor="middle" class="serif green" font-size="13" font-weight="700" letter-spacing="2">IV</text>
    <text x="870" y="322" text-anchor="middle" class="sans ink" font-size="15" font-weight="600">Live</text>
  </g>

  <!-- the traveling scroll -->
  <g class="a scroll">
    <rect x="-38" y="-17" width="76" height="36" rx="2" fill="#E9DDBF"/>
    <rect x="-44" y="-22" width="88" height="7" rx="3.5" fill="#D6B25C"/>
    <rect x="-44" y="17" width="88" height="7" rx="3.5" fill="#D6B25C"/>
    <rect x="-22" y="-8" width="40" height="3" rx="1.5" fill="#B9A67A"/><rect x="-22" y="-1" width="28" height="3" rx="1.5" fill="#B9A67A"/><rect x="-22" y="6" width="34" height="3" rx="1.5" fill="#B9A67A"/>
    <g class="a stamp"><text x="0" y="14" text-anchor="middle" class="serif" font-size="7" font-weight="700" fill="#4A7536" letter-spacing=".6">PROBATVM</text></g>
    <g class="a seal"><circle cx="39" cy="19" r="11" fill="#9C1C1C"/><text x="39" y="23.5" text-anchor="middle" class="serif" font-size="12" font-weight="700" fill="#F7DDA9">C</text></g>
  </g>

  <!-- panels -->
  <rect x="40" y="356" width="296" height="164" rx="12" class="card"/>
  <text x="60" y="384" class="serif gold" font-size="12" font-weight="700" letter-spacing="2">II · MANDATE</text>
  <text x="316" y="384" text-anchor="end" class="mono dim" font-size="11">you approve it</text>
  <g class="sans" font-size="13.5">
    <g class="a r1"><rect x="60" y="400" width="14" height="14" rx="3" fill="none" stroke="#8F8698" stroke-width="1.6"/><text x="84" y="412" class="ink">Create an invoice with line items</text></g>
    <g class="a r2"><rect x="60" y="428" width="14" height="14" rx="3" fill="none" stroke="#8F8698" stroke-width="1.6"/><text x="84" y="440" class="ink">List and filter by status</text></g>
    <g class="a r3"><rect x="60" y="456" width="14" height="14" rx="3" fill="none" stroke="#8F8698" stroke-width="1.6"/><text x="84" y="468" class="ink">Mark sent or paid</text></g>
    <g class="a r4"><rect x="60" y="484" width="14" height="14" rx="3" fill="none" stroke="#8F8698" stroke-width="1.6"/><text x="84" y="496" class="ink">See who still owes you</text></g>
    <g class="a chk" fill="none" stroke="#8DBB6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M63 407l3.5 3.5 6-7"/><path d="M63 435l3.5 3.5 6-7"/><path d="M63 463l3.5 3.5 6-7"/><path d="M63 491l3.5 3.5 6-7"/>
    </g>
  </g>

  <rect x="352" y="356" width="296" height="164" rx="12" class="card"/>
  <text x="372" y="384" class="serif gold" font-size="12" font-weight="700" letter-spacing="2">III · SPECIALISTS</text>
  <text x="628" y="384" text-anchor="end" class="mono dim" font-size="11">one at a time</text>
  <g class="mono" font-size="12.5">
    <g class="a sp">
      <rect x="372" y="400" width="62" height="22" rx="11" fill="#3A1E29"/><text x="403" y="415" text-anchor="middle" class="rose">infra</text>
      <rect x="372" y="436" width="62" height="22" rx="11" fill="#3A1E29"/><text x="403" y="451" text-anchor="middle" class="rose">backend</text>
      <rect x="372" y="472" width="62" height="22" rx="11" fill="#3A1E29"/><text x="403" y="487" text-anchor="middle" class="rose">frontend</text>
    </g>
    <g class="a ok1"><text x="446" y="415" class="ink">db + 2 services live</text><text x="626" y="415" text-anchor="end" class="green">✓</text></g>
    <g class="a ok2"><text x="446" y="451" class="ink">11 tests, real DB</text><text x="626" y="451" text-anchor="end" class="green">✓</text></g>
    <g class="a ok3"><text x="446" y="487" class="ink">screens checked</text><text x="626" y="487" text-anchor="end" class="green">✓</text></g>
  </g>

  <rect x="664" y="356" width="296" height="164" rx="12" class="card"/>
  <text x="684" y="384" class="serif gold" font-size="12" font-weight="700" letter-spacing="2">IV · LIVE</text>
  <text x="940" y="384" text-anchor="end" class="mono dim" font-size="11">on your accounts</text>
  <g class="a livetxt mono" font-size="12.5">
    <rect x="684" y="400" width="256" height="30" rx="8" fill="#17131C" stroke="#352E3E"/>
    <circle cx="700" cy="415" r="5" class="a url1"/><text x="714" y="419" class="ink">your-app.onrender.com</text>
    <rect x="684" y="438" width="256" height="30" rx="8" fill="#17131C" stroke="#352E3E"/>
    <circle cx="700" cy="453" r="5" class="a url2"/><text x="714" y="457" class="ink">your-app-api.onrender.com</text>
    <text x="684" y="496" class="sans dim" font-size="13">Code on GitHub. Servers on Render.</text>
  </g>
</g>

<text x="500" y="545" text-anchor="middle" class="sans dim" font-size="13">Each turn, a separate checker asks whether the brief is done or truly needs you. Waiting is never reported as finished.</text>
</svg>
